<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="50%" stop-color="#302B63"/>
      <stop offset="100%" stop-color="#24243E"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FD79A8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FD79A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CEC9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00CEC9" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="url(#heroBg)"/>
  <circle cx="200" cy="160" r="260" fill="url(#orb)"/>
  <circle cx="1080" cy="500" r="220" fill="url(#orbPink)"/>
  <circle cx="240" cy="540" r="200" fill="url(#orbTeal)"/>
  <g transform="translate(640,320)" filter="url(#heroShadow)">
    <rect x="-150" y="-180" width="300" height="68" rx="18" fill="#FFFFFF" opacity="0.35"/>
    <rect x="-150" y="-100" width="300" height="68" rx="18" fill="#FFFFFF" opacity="0.55"/>
    <rect x="-150" y="-20"  width="300" height="68" rx="18" fill="#FFFFFF" opacity="0.80"/>
    <rect x="-150" y="60"   width="300" height="68" rx="18" fill="#FFFFFF" opacity="1.00"/>
  </g>
  <text x="640" y="560" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">StackTasks</text>
</svg>
