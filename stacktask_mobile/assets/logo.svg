<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#bgGrad)"/>
  <g filter="url(#cardShadow)">
    <rect x="80" y="80" width="160" height="32" rx="10" ry="10" fill="#FFFFFF" opacity="0.45"/>
    <rect x="64" y="120" width="160" height="32" rx="10" ry="10" fill="#FFFFFF" opacity="0.70"/>
    <rect x="48" y="160" width="160" height="32" rx="10" ry="10" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <circle cx="180" cy="176" r="6" fill="#6C5CE7"/>
</svg>
